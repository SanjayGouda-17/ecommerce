<!DOCTYPE html>
<html>
<head>
    <title>Simple E-Commerce Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
            padding: 20px;
        }

        .product {
            background: white;
            width: 350px;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Online Store</h1>
    <p>Best Deals for You</p>
</header>

<div class="container">

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="Product 1">
        <h3>Smartphone</h3>
        <p>Latest Android smartphone.</p>
        <p class="price">₹15,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="Product 2">
        <h3>Laptop</h3>
        <p>Powerful laptop for work and study.</p>
        <p class="price">₹49,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/250x180" alt="Product 3">
        <h3>Headphones</h3>
        <p>Wireless noise-cancelling headphones.</p>
        <p class="price">₹2,999</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>&copy; 2026 My Online Store. All Rights Reserved.</p>
</footer>

</body>
</html>
